name: site-checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: npm ci --ignore-scripts=false
      - name: Copy and voice rules, JSON-LD, tag balance, house checks
        run: python3 scripts/verify.py
      - name: Build parity (source, partials, sitemap, dist must be committed)
        run: node build.mjs --check --no-images
      - name: Internal link check
        run: python3 scripts/linkcheck.py
      - name: Lighthouse (SEO must score 100, budgets on performance)
        run: |
          npm install -g @lhci/cli@0.14.0
          lhci autorun --config=lighthouserc.json
