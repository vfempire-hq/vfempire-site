<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" width="620" height="520" role="img" aria-labelledby="p21-mech-title">
  <title id="p21-mech-title">A minimal compass over a translucent planet mesh with three sealed lanes glowing beneath</title>
  <defs>
    <radialGradient id="p21-planet" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#eceff3"/>
      <stop offset="100%" stop-color="#c9d0dd"/>
    </radialGradient>
    <linearGradient id="p21-lane" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#1f6ff2" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1f6ff2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1f6ff2" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- planet -->
  <circle cx="310" cy="310" r="180" fill="url(#p21-planet)" stroke="#e4e6ea" stroke-width="1"/>
  <ellipse cx="310" cy="310" rx="180" ry="66" fill="none" stroke="#c9d0dd" stroke-width="0.7"/>
  <ellipse cx="310" cy="310" rx="66"  ry="180" fill="none" stroke="#c9d0dd" stroke-width="0.7"/>
  <ellipse cx="310" cy="310" rx="180" ry="118" fill="none" stroke="#c9d0dd" stroke-width="0.5"/>

  <!-- compass -->
  <g transform="translate(310 130)">
    <circle r="72" fill="#ffffff" stroke="#e4e6ea" stroke-width="1.2"/>
    <path d="M 0 -50 L 8 0 L 0 -8 L -8 0 Z" fill="#1f6ff2"/>
    <path d="M 0 50  L 8 0 L 0 8  L -8 0 Z" fill="#c9d0dd"/>
    <circle r="6" fill="#1d1d1f"/>
    <circle r="2.5" fill="#1f6ff2"/>
    <text y="-58" font-family="Georgia, serif" font-size="10" fill="#a1a1a6" text-anchor="middle" font-weight="700">N</text>
  </g>

  <!-- three sealed lanes below -->
  <g transform="translate(310 460)">
    <rect x="-220" y="-58" width="440" height="18" rx="9" fill="rgba(255,255,255,0.6)" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="-210" y="-53" width="420" height="8" rx="4" fill="url(#p21-lane)"/>
    <text x="-220" y="-64" font-family="-apple-system, sans-serif" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="0.14em">FULL-OFFLINE</text>

    <rect x="-220" y="-28" width="440" height="18" rx="9" fill="rgba(255,255,255,0.6)" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="-210" y="-23" width="420" height="8" rx="4" fill="url(#p21-lane)" opacity="0.85"/>
    <text x="-220" y="-34" font-family="-apple-system, sans-serif" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="0.14em">HYBRID (DEFAULT)</text>

    <rect x="-220" y="2"   width="440" height="18" rx="9" fill="rgba(255,255,255,0.6)" stroke="#e4e6ea" stroke-width="1"/>
    <rect x="-210" y="7"   width="420" height="8" rx="4" fill="url(#p21-lane)" opacity="0.7"/>
    <text x="-220" y="-4" font-family="-apple-system, sans-serif" font-size="10" fill="#6e6e73" font-weight="600" letter-spacing="0.14em">ONLINE</text>
  </g>
</svg>
