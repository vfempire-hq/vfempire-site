<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="p21-title">
  <title id="p21-title">NAV·IT — a minimal compass rose sealed inside a translucent shell</title>
  <defs>
    <radialGradient id="p21-shell" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="65%" stop-color="#eceff3" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9d0dd" stop-opacity="0.15"/>
    </radialGradient>
    <linearGradient id="p21-needle" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1f6ff2"/>
      <stop offset="55%" stop-color="#1f6ff2"/>
      <stop offset="55%" stop-color="#9db6d4"/>
      <stop offset="100%" stop-color="#9db6d4"/>
    </linearGradient>
    <filter id="p21-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <circle cx="200" cy="200" r="150" fill="url(#p21-shell)" stroke="#e4e6ea" stroke-width="1.4"/>
  <circle cx="200" cy="200" r="112" fill="none" stroke="#c9d0dd" stroke-width="0.7" stroke-dasharray="1 4"/>
  <circle cx="200" cy="200" r="150" fill="none" stroke="rgba(31,111,242,0.18)" stroke-width="1" filter="url(#p21-glow)"/>
  <g fill="#a1a1a6" font-family="Georgia, serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="200" y="72">N</text>
    <text x="330" y="207">E</text>
    <text x="200" y="342">S</text>
    <text x="70"  y="207">W</text>
  </g>
  <path d="M 200 88 L 214 208 L 200 200 L 186 208 Z" fill="url(#p21-needle)"/>
  <path d="M 200 312 L 214 208 L 200 200 L 186 208 Z" fill="#f2f3f6" opacity="0.55"/>
  <circle cx="200" cy="200" r="9" fill="#1d1d1f"/>
  <circle cx="200" cy="200" r="4" fill="#1f6ff2"/>
</svg>
