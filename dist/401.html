<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restricted — VF Empire</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f5f5f7'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-size='30' fill='%231d1d1f' text-anchor='middle'%3EVF%3C/text%3E%3C/svg%3E">
<style>
@font-face{font-family:'Hanken';src:url('/fonts/hanken.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--paper:#fbfbfd;--silver:#f5f5f7;--ink:#1d1d1f;--dove:#6e6e73;--faint:#a1a1a6;--line:#e4e6ea;--core:#1f6ff2;--core-deep:#0b47b8;--amber:#c76b1d}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Hanken',-apple-system,sans-serif;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}
.nav{position:fixed;top:0;left:0;right:0;height:52px;display:flex;align-items:center;padding:0 28px;background:rgba(251,251,253,.78);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6);border-bottom:1px solid var(--line);z-index:50}
.brand{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;letter-spacing:.14em;color:var(--ink);text-decoration:none}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:100px 24px 60px}
.orb{width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 34% 28%, #ffffff 0%, #f2f3f6 42%, #dfe3ea 78%, #d3d8e1 100%);box-shadow:0 30px 60px rgba(29,29,31,.13), inset 0 -12px 28px rgba(160,170,185,.25), inset 0 10px 18px #fff;position:relative;margin-bottom:44px}
.orb::after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 35%, #ffd9a8 0%, var(--amber) 55%, #8f4a10 100%);box-shadow:0 0 26px rgba(199,107,29,.55);animation:scan 2.2s ease-in-out infinite}
@keyframes scan{0%,100%{box-shadow:0 0 22px rgba(199,107,29,.45)}50%{box-shadow:0 0 46px rgba(199,107,29,.8)}}
.code{font-size:13px;font-weight:600;letter-spacing:.3em;color:var(--amber);margin-bottom:14px}
h1{font-size:clamp(34px,6vw,58px);font-weight:700;letter-spacing:-.035em;line-height:1.04;margin-bottom:16px}
h1 .mute{color:var(--faint)}
p{font-size:16px;line-height:1.6;color:var(--dove);max-width:430px;margin-bottom:34px}
.bt{display:inline-block;background:var(--core);color:#fff;font-size:14px;font-weight:600;padding:13px 30px;border-radius:99px;text-decoration:none;transition:background .2s}
.bt:hover{background:var(--core-deep)}
footer{border-top:1px solid var(--line);background:var(--silver);padding:22px;text-align:center;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
<nav class="nav"><a class="brand" href="/"><svg width="18" height="18" viewBox="0 0 24 24"><path d="M3 4l5.2 16h2.2L4.4 4H3zm7 0l5.2 16h2.2L11.4 4H10zm10.6 0h-6.2l.7 2.1h5.5V4zm-4.2 6.6l.7 2.1h3.5v-2.1h-4.2z" fill="#1d1d1f"/></svg>VF EMPIRE</a></nav>
<main>
  <div class="orb"></div>
  <div class="code">ERROR 401 — RESTRICTED</div>
  <h1>The gate stays<br><span class="mute">closed.</span></h1>
  <p>This area of the VF floor requires authorisation. If you believe you should have access, contact the house.</p>
  <a class="bt" href="/">Back to VF Empire</a>
</main>
<footer>© 2026 VF Empire Corp Ltd · Għajnsielem, Gozo, Malta, EU</footer>
</body>
</html>
